[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-radar"
version = "0.1.0"
description = "Watch employer job boards directly and only be told about roles that pass your own filters."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Callum McDonald" }]
keywords = ["jobs", "job-search", "ats", "greenhouse", "ashby", "lever", "workday"]
dependencies = [
    "requests>=2.28",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/maccydee/job-radar"
Issues = "https://github.com/maccydee/job-radar/issues"

[project.optional-dependencies]
# A CV is most often a PDF, and reading one is the difference between scoring
# somebody's career and scoring the bytes of a file header. It is optional
# rather than required because the tool's whole install is requests and PyYAML,
# and everything except reading a PDF CV works without it. `rank` says so by
# name when it is missing rather than failing obscurely.
pdf = ["pypdf>=4"]

[project.scripts]
job-radar = "jobradar.cli:main"

[tool.setuptools]
packages = ["jobradar", "jobradar.adapters", "jobradar.output"]

[tool.setuptools.package-data]
jobradar = ["../sources/*.json", "../skills/*/*", "../skills/*/*/*"]
