name: tests

on:
  push:
    branches: [main]
  pull_request:

# Read-only. Without this block the job inherits whatever the repository's
# default is, which for a repo created before February 2023 is read/write on
# everything, handed to a job whose whole purpose is to execute code from a
# pull request.
permissions:
  contents: read

jobs:
  test:
    # Every version the package claims to support, and Windows.
    #
    # Pinning one version is why a backslash inside an f-string expression
    # shipped: that is a syntax error before 3.12, so `serve` and the
    # installer could not even parse on the 3.10 and 3.11 that pyproject and
    # the README badge both promise. A matrix is the only thing that catches a
    # claim the code does not keep.
    #
    # Windows is here for the same reason. Text I/O without an explicit
    # encoding uses cp1252 there, and the shipped source list already contains
    # an accented company name.
    runs-on: ${{ matrix.os }}
    # The suite runs in about a minute. Five of these start at once, so a hung
    # one holding a runner for the default six hours costs five runners, and on
    # a free account that is the whole allowance.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          - python-version: "3.12"
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      # No pytest dependency on purpose: the suite runs standalone so that
      # anyone can check the salary and location logic without installing
      # anything beyond the tool itself.
      #
      # run_all.py rather than test_core.py, because naming one file meant the
      # second one never ran. test_locations.py held 47 tests, every
      # country-code rule among them, and CI had not executed one of them since
      # the day it was added. run_all.py discovers `test_*.py`, so a new file
      # runs here without anyone remembering to edit this line.
      - run: python tests/run_all.py
