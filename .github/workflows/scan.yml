name: scan

# Fork this repo, edit config.yaml, and this runs on its own.
#
# Two things worth knowing before you rely on it:
#
#  * Actions runners share IP ranges with a very large number of other repos,
#    so job boards throttle them sooner than they throttle your laptop. The
#    scan reports sources that look throttled rather than pretending they were
#    empty, but if you see a lot of them, run it locally instead.
#  * State is committed back to this repo, not cached. The Actions cache is
#    evicted after 7 days of no use, which would make every role look new
#    again.

on:
  schedule:
    - cron: "0 7 * * 1-5"   # 07:00 UTC, weekdays
  workflow_dispatch:

permissions:
  contents: write     # commit state/seen.json
  issues: write       # post new roles
  pages: write
  id-token: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      - name: Scan
        run: job-radar scan --out out

      - name: Commit what we have seen
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "state: $(date -u +%Y-%m-%d) scan"
            # A scan takes minutes, and anything landing on main meanwhile
            # makes this push a non-fast-forward. Rebase and retry rather than
            # failing the run and losing the state we just computed.
            for i in 1 2 3; do
              git push && break
              echo "push rejected, rebasing (attempt $i)"
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || exit 1
              sleep 3
            done
          else
            echo "no state change"
          fi

      - name: Post new roles as an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW=$(python3 -c "import json;print(len(json.load(open('out/roles.json'))['new']))")
          if [ "$NEW" -gt 0 ]; then
            python3 - > body.md <<'PY'
          import json
          d = json.load(open("out/roles.json"))
          print(f"{len(d['new'])} new role(s) since the last run.\n")
          for j in d["new"]:
              pay = j["salary"]["raw"] if j["salary"]["confirmed"] else "unconfirmed salary"
              loc = j["location"] or "location not stated"
              print(f"- **[{j['title']}]({j['url']})** — {j['company']} · {loc} · {pay} · score {j['score']:.0f}")
              for f in j["flags"]:
                  print(f"  - {f}")
          m = d["meta"]
          print(f"\n<sub>{m['sources_ok']}/{m['sources_total']} sources responded.</sub>")
          if m.get("throttled"):
              print(f"\n<sub>{len(m['throttled'])} sources returned nothing but have "
                    f"returned jobs before, so they may be rate limited rather than empty.</sub>")
          PY
            gh issue create --title "New roles: $(date -u +%Y-%m-%d) ($NEW)" --body-file body.md
          else
            echo "nothing new"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  publish:
    # Serves the dashboard at https://<you>.github.io/job-radar/
    # Needs Pages enabled once: Settings > Pages > Source: GitHub Actions.
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
